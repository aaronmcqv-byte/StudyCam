<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Camera Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>ESP32 Camera Dashboard</h1>

    <div class="card">
        <h2>Live Feed</h2>
        <img src="placeholder.jpg" alt="Camera Feed">
    </div>

    <div class="card">
        <h2>Status</h2>
        <p id="status">Camera: Offline</p>
        <p>Last Motion: Never</p>
    </div>

</div>

</body>
</html>
